[workspace]
resolver = "2"
members = ["crates/bld", "crates/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

# Declared here so Stage 1 (spec parse → validate → render) can pull them in
# without re-deciding versions. The CLI stub in this first commit uses none of
# them yet — it only prints its planned command surface.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Dev-only: proves the scaffolder's generated Rust is syntactically valid. Full
# compilation against bld-kernel is a Stage-4 check (that is when the kernel dep
# arrives); syntactic validity is what Stage 2 can honestly witness on its own.
syn = { version = "2", features = ["full", "parsing"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
