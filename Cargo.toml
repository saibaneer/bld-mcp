[workspace]
resolver = "2"
members = ["crates/bld"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

# Declared here so Stage 1 (spec parse → validate → render) can pull them in
# without re-deciding versions. The CLI stub in this first commit uses none of
# them yet — it only prints its planned command surface.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
